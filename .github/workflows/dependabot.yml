name: Dependabot PRs

on:
  pull_request:
    branches:
      - main

jobs:
  # PR Tests already runs on every pull request, so this copy only runs for
  # Dependabot's, where auto-merge below has to wait for it to pass
  pr:
    if: ${{ github.actor == 'dependabot[bot]' }}
    uses: ./.github/workflows/pr.yml
  dependabot:
    runs-on: ubuntu-latest
    needs: [pr]
    if: ${{ github.actor == 'dependabot[bot]' }}
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Major version bumps can break things the tests don't cover, so they
      # are left open for a person to review and merge
      - name: Approve the PR
        if: ${{ steps.metadata.outputs.update-type != 'version-update:semver-major' }}
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for Dependabot PRs
        if: ${{ steps.metadata.outputs.update-type != 'version-update:semver-major' }}
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

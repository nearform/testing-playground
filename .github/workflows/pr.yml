name: PR Tests

on:
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

# The checks only read the code
permissions:
  contents: read

jobs:
  pr-tests:
    runs-on: ubuntu-latest
    # A new push makes the run for the previous one pointless. Set on the job,
    # not the workflow: the Dependabot PRs workflow also calls this one, and a
    # called workflow's github.workflow is its caller's name, so the two runs
    # on a Dependabot PR get separate groups and never cancel each other.
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # The pre-commit hook formats staged files, but it can be skipped
      - name: Check formatting
        run: npm run format:check

      # npm run build type checks the app and its build config before Vite builds
      - name: Type check and build
        run: npm run build

      - name: Run Vitest
        run: npm run test

  # package.json's engines also allows Node 22 and 24, so the build and the
  # tests run on those too. Lint and formatting don't depend on the Node
  # version, so pr-tests alone checks them. A separate job, so the required
  # pr-tests check keeps its name.
  other-node-versions:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-node-${{ matrix.node }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check and build
        run: npm run build

      - name: Run Vitest
        run: npm run test
